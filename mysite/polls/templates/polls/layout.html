<!DOCTYPE html>
<head>
<title>Poll: {% block title %}{% endblock %}</title>
</head>
<a href="/">home</a>
<br>
{% if user.is_authenticated %}
Logged in as {{user.username}}.
<form action="{% url 'polls:logout' %}" method="POST">
	{% csrf_token %}
    <input type="submit" value="Logout"/>
</form>
{% else %}
You are not logged in.
<p></p>
<form action="{% url 'polls:login' %}" method="GET">
	{% csrf_token %}
    <input type="submit" value="Login"/>
</form>
<form action="{% url 'polls:signup' %}" method="GET">
	{% csrf_token %}
    <input type="submit" value="Sign up"/>
</form>

</p>
{% endif %}


<body>
{% block body %}
{% endblock %}
</body>

</html>
